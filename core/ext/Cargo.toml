[package]
name = "ticketsim-core"
description = "The event engine of ticketsim as a Python extension module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "ticketsim_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py39"] }
ticketsim-world = { path = "../world" }

[build-dependencies]
pyo3-build-config = "0.30.1"
