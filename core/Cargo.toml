# The Rust world core of ticketsim (docs/ENGINEERING.md).
#
#   world/  ticketsim-world  the pure world model: keyed RNG, crowd, sessions, pools, orders
#   ext/    ticketsim-core   the event engine and the Python boundary (PyO3 extension module)
#
# `ticketsim-world` has no Python dependency, so `cargo test` runs without an interpreter.
[workspace]
resolver = "3"
members = ["world", "ext"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
