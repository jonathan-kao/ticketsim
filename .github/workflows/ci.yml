name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The golden fixtures are bit exact and use the platform's libm, so CI runs
    # on the platform they were written on (macOS, arm64).
    runs-on: macos-latest
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache the project-local Rust toolchain and build
        uses: actions/cache@v4
        with:
          path: |
            .rustup
            .cargo
            core/target
          key: rust-${{ runner.os }}-${{ hashFiles('mise.toml', 'core/Cargo.lock') }}

      - uses: jdx/mise-action@v2

      - name: Rust unit tests, Python suite, golden check on both engines
        run: mise run test

      - name: Web UI harness
        run: |
          python3 -m ticketsim serve --port 8123 &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:8123/api/bootstrap >/dev/null && break; sleep 0.2; done
          node tests/ui_harness.js 8123
